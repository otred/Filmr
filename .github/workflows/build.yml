name: Build Filmr TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean obsolete legacy files if any
        run: |
          find app/src/main/java/com/filmr/tv -type f \
            ! -name "MainActivity.kt" \
            ! -name "Models.kt" \
            ! -name "FilmrDatabase.kt" \
            ! -name "StremioAddonService.kt" \
            ! -name "CloudStreamRepoService.kt" \
            ! -name "TmdbMetadataService.kt" \
            ! -name "FilmrViewModel.kt" \
            ! -name "NuvioComponents.kt" \
            ! -name "NuvioScreens.kt" \
            ! -name "NuvioPlayerScreen.kt" \
            -delete || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Filmr APK
        uses: actions/upload-artifact@v4
        with:
          name: Filmr-TV-APK
          path: app/build/outputs/apk/debug/*.apk
